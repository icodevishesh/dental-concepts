<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">Dental model printing illustration</title>
  <desc id="desc">A clean, softly lit illustration of a dental arch model with fine printed layer lines.</desc>
