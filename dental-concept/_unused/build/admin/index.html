<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel | Dental Concepts</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="admin.css?v=1">
<script src="../data/config.js?v=1"></script>
<script src="../data/store.js?v=1" defer></script>
<script src="admin.js?v=1" defer></script>
</head>
<body>
<section class="login" id="login" hidden>
<div class="login-box">
<img src="../assets/dental-concepts-logo.png" width="626" height="160" alt="Dental Concepts">
<h1>Admin sign in</h1>
<p id="login-hint">Sign in to manage the website.</p>
<form id="login-form" novalidate>
<label class="fld" id="login-email-row">Email<input type="email" id="login-email" autocomplete="username"></label>
<label class="fld">Password<input type="password" id="login-pw" autocomplete="current-password" required></label>
<p class="login-err" id="login-err" role="alert"></p>
<button class="btn" type="submit">Sign in</button>
</form>
</div>
</section>

<div id="app" hidden>
<header class="adm-head"><div class="wrap adm-head-in">
<a class="adm-brand" href="#overview"><small>Admin panel</small><img src="../assets/dental-concepts-logo.png" width="626" height="160" alt="Dental Concepts"></a>
<div class="adm-head-actions"><span class="mode-pill" id="mode-pill">Local data</span><a class="btn btn-light" href="../index.html" target="_blank" rel="noopener">View website</a><button class="btn btn-danger" type="button" id="logout">Log out</button></div>
</div></header>
<div class="wrap">
<nav class="adm-tabs" role="tablist" aria-label="Admin sections">
<button class="adm-tab" role="tab" data-tab="overview">Overview</button>
<button class="adm-tab" role="tab" data-tab="blog">Blog <span class="count" data-count="posts"></span></button>
<button class="adm-tab" role="tab" data-tab="leads">Leads <span class="count" data-count="leads"></span></button>
<button class="adm-tab" role="tab" data-tab="uploads">Digital uploads <span class="count" data-count="uploads"></span></button>
<button class="adm-tab" role="tab" data-tab="testimonials">Testimonials <span class="count" data-count="testimonials"></span></button>
<button class="adm-tab" role="tab" data-tab="events">Events <span class="count" data-count="events"></span></button>
<button class="adm-tab" role="tab" data-tab="data">Data &amp; backup</button>
</nav>
<main class="adm-main" id="view" tabindex="-1"></main>
</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
